[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-tool"
dynamic = ["version"]
description = "Home Assistant CLI for discovering, querying, and controlling entities over WebSocket"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Zsolt Sz", email = "zsolt@kucko.cc" }]
keywords = [
    "home-assistant",
    "cli",
    "websocket",
    "automation",
    "smart-home",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["typer>=0.12", "pydantic>=2.0", "websockets>=13.0"]

[dependency-groups]
# ruff and mypy are pinned: CI installed them unpinned and drifted to a newer
# release whose default rules failed a tree that passed locally.
dev = ["pytest>=8.0", "ruff==0.16.2", "mypy==2.3.0"]

[project.urls]
Homepage = "https://github.com/szsolt/ha-tool"
Repository = "https://github.com/szsolt/ha-tool"
Issues = "https://github.com/szsolt/ha-tool/issues"

[project.scripts]
ha-tool = "ha_tool.cli:main"

[tool.hatch.version]
path = "ha_tool/__init__.py"

[tool.hatch.build.targets.sdist]
# Ship the package, its docs, and the installable skill. Everything else
# (agent scratch notes, CI config, local hooks) is repo-only.
include = [
    "ha_tool",
    "tests",
    "skills",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["ha_tool"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP042: the str+Enum bases are load-bearing — Typer renders these as CLI
# choice values, and StrEnum would change the rendered surface.
ignore = ["UP042"]
